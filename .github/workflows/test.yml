name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]
  schedule:
  - cron: "0 5 * * TUE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build the Python SDist and wheel, performs metadata and readme linting
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Needed for setuptools_scm
      - uses: hynek/build-and-inspect-python-package@v2
        id: baipp

    outputs:
      python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}

  test:
    # Test package build in matrix of OS and Python versions
    name: Test package
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.build.outputs.python-versions) }}
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Needed for setuptools_scm

    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install ubuntu dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get install glpk-utils
        sudo apt-get install coinor-cbc

    - name: Install macos dependencies
      if: matrix.os == 'macos-latest'
      run: |
        brew install glpk hdf5

    - name: Set up windows package manager
      if: matrix.os == 'windows-latest'
      uses: crazy-max/ghaction-chocolatey@v4
      with:
          args: -h

    - name: Install windows dependencies
      if: matrix.os == 'windows-latest'
      run: |
        choco install glpk

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Install package and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "$(ls dist/*.whl)[dev,solvers,oetc]"

    - name: Test with pytest
      env:
        MOSEKLM_LICENSE_FILE: ${{ secrets.MSK_LICENSE }}
      run: |
        pytest --cov=./ --cov-report=xml linopy --doctest-modules test

    - name: Upload code coverage report
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  check-types:
    name: Check types
    needs: [build]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Needed for setuptools_scm

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Install package and dependencies
      run: |
        python -m pip install uv
        uv pip install --system "$(ls dist/*.whl)[dev]"

    - name: Run type checker (mypy)
      run: |
        mypy .

  no-extras:
    # The base install must work without polars, dask, tqdm and deprecation.
    # This job catches a hard import reintroduced into the core path.
    name: Core install without optional dependencies
    needs: [build]
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: 3.12

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: dist

    - name: Install the wheel with no extras
      run: |
        python -m pip install uv
        uv pip install --system "$(ls dist/*.whl)"
        uv pip install --system highspy

    - name: Smoke test the core install
      run: |
        python - <<'PY'
        import importlib.util

        # The wheel with no extras must not pull in any of the optional extras.
        for optional in ("polars", "dask", "tqdm"):
            assert importlib.util.find_spec(optional) is None, optional

        import pandas as pd

        from linopy import Model

        m = Model()
        t = pd.RangeIndex(6, name="t")
        x = m.add_variables(lower=0, coords=[t], name="x")
        y = m.add_variables(lower=0, coords=[t], name="y")
        m.add_constraints(x + y >= 1)
        m.add_objective(2 * x + 3 * y)

        # xarray's ffill/bfill import bottleneck directly, with no numpy
        # fallback, so bottleneck has to stay a declared dependency.
        x.ffill("t")
        x.bfill("t")

        status, condition = m.solve(io_api="direct")
        assert status == "ok", (status, condition)
        # One x per time step at cost 2, since x + y >= 1 and 2x + 3y.
        assert abs(float(m.objective.value) - 2.0 * len(t)) < 1e-9

        m.to_file("smoke.mps", io_api="mps")

        print("core install smoke test passed")
        PY
